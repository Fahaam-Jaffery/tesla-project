name: Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  production-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install project dependencies
        run: npm install --no-audit --no-fund
      - name: Build for production
        run: npm run build
